<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumo Robot - Vezérlőpult</title>
    <!-- Tailwind CSS behúzása a modern kinézethez -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4 md:p-8 min-h-screen flex flex-col">

    <!-- Fejléc -->
    <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-emerald-400">SumoRobot Dashboard</h1>
            <p class="text-slate-400 text-sm mt-1">Szoftver Tervezés Projekt 2026</p>
        </div>
        <div class="flex items-center space-x-3 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500"></div>
            <span id="status-text" class="text-sm font-semibold text-slate-300">Leválasztva</span>
        </div>
    </header>

    <!-- Fő rács (Műszerek) -->
    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- Akkumulátor kártya -->
        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-300 mb-4">Akkumulátor Szint</h2>
            <div class="flex items-end space-x-2 mb-2">
                <span id="battery-value" class="text-4xl font-mono text-white">--.-</span>
                <span class="text-xl text-slate-400 mb-1">V</span>
            </div>
            <!-- Progress bar -->
            <div class="w-full bg-slate-700 rounded-full h-4 mt-4 overflow-hidden">
                <div id="battery-bar" class="bg-blue-500 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p class="text-xs text-slate-500 mt-2">Névleges: 7.4V (2S LiPo)</p>
        </div>

        <!-- Szenzorok kártya -->
        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-300 mb-4">Szenzor Adatok</h2>
            
            <div class="space-y-4">
                <div>
                    <p class="text-sm text-slate-400">Ultrahang távolság (Elől)</p>
                    <div class="flex justify-between items-center mt-1">
                        <span id="distance-value" class="text-2xl font-mono">--</span>
                        <span class="text-slate-500">cm</span>
                    </div>
                </div>
                
                <div class="h-px w-full bg-slate-700"></div>
                
                <div>
                    <p class="text-sm text-slate-400">Vonalérzékelő (Alul)</p>
                    <div class="flex items-center mt-2 space-x-3">
                        <div id="line-color-dot" class="w-6 h-6 rounded-full bg-slate-600 border border-slate-500"></div>
                        <span id="line-sensor-text" class="text-xl font-mono uppercase">Ismeretlen</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Valós idejű log kártya -->
        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg col-span-1 md:col-span-2 lg:col-span-1 flex flex-col">
            <h2 class="text-lg font-semibold text-slate-300 mb-4">Rendszer Logok</h2>
            <div id="log-container" class="flex-grow bg-slate-900 rounded-lg p-3 font-mono text-xs text-emerald-400 overflow-y-auto h-48 border border-slate-700 flex flex-col space-y-1">
                <div class="text-slate-500">Rendszer indulása... Várom az adatokat.</div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logika -->
    <script>
        // Konfiguráció
        const API_URL = 'http://localhost:8080/api/status';
        const FETCH_INTERVAL_MS = 1000; // Milyen gyakran kérdezze le (1000ms = 1 mp)

        // DOM Elemek kiválasztása
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const batteryValue = document.getElementById('battery-value');
        const batteryBar = document.getElementById('battery-bar');
        const distanceValue = document.getElementById('distance-value');
        const lineSensorText = document.getElementById('line-sensor-text');
        const lineColorDot = document.getElementById('line-color-dot');
        const logContainer = document.getElementById('log-container');

        // Log hozzáfűző segédfüggvény
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.textContent = `[${time}] ${message}`;
            
            if (type === 'error') logLine.classList.add('text-red-400');
            else if (type === 'warn') logLine.classList.add('text-yellow-400');
            
            logContainer.appendChild(logLine);
            
            // Auto-scroll a legalsó elemhez
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Tartsuk meg csak a legutóbbi 50 logot, hogy ne egye meg a memóriát
            if (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Felület frissítése a kapott JSON adatok alapján
        function updateDashboard(data) {
            // Kapcsolat státusz frissítése
            statusDot.classList.replace('bg-red-500', 'bg-emerald-500');
            statusText.textContent = "Kapcsolódva";

            // Akku frissítése (Feltételezve, hogy 6.0V a lemerült, 8.4V a teljesen töltött)
            const voltage = data.battery;
            batteryValue.textContent = voltage.toFixed(1);
            let percent = ((voltage - 6.0) / (8.4 - 6.0)) * 100;
            percent = Math.max(0, Math.min(100, percent)); // Szorítsuk 0 és 100 közé
            
            batteryBar.style.width = `${percent}%`;
            if(percent < 20) batteryBar.className = "bg-red-500 h-4 rounded-full transition-all duration-500";
            else if(percent < 50) batteryBar.className = "bg-yellow-500 h-4 rounded-full transition-all duration-500";
            else batteryBar.className = "bg-emerald-500 h-4 rounded-full transition-all duration-500";

            // Szenzorok frissítése
            distanceValue.textContent = data.distance_cm;
            
            lineSensorText.textContent = data.line_sensor;
            if(data.line_sensor === "Fehér") {
                lineColorDot.className = "w-6 h-6 rounded-full bg-white border border-slate-500";
            } else {
                lineColorDot.className = "w-6 h-6 rounded-full bg-black border border-slate-500";
            }

            // Új log üzenet megjelenítése, ha küldött a szerver
            if(data.log_message) {
                addLog(data.log_message);
            }
        }

        // Adatlekérdező ciklus
        async function fetchRobotData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Hálózati hiba');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                // Ha megszakad a kapcsolat a Python szkripttel
                statusDot.classList.replace('bg-emerald-500', 'bg-red-500');
                statusText.textContent = "Kapcsolat megszakadt";
                // Nem logoljuk minden másodpercben, hogy tele a konzol
            }
        }

        // Indítás: folyamatos lekérdezés beállítása
        addLog("Csatlakozás a szerverhez...");
        setInterval(fetchRobotData, FETCH_INTERVAL_MS);
        
        // Csináljunk egy első lekérdezést azonnal, ne várjunk 1 másodpercet
        fetchRobotData();

    </script>
</body>
</html>
